[project]
name = "skypoints-etl"
version = "0.1.0"
description = "SkyPoints member and redemption ingestion into Snowflake"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "snowflake-connector-python>=3.12",
]

[project.scripts]
skypoints = "skypoints.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skypoints"]

[tool.hatch.build.targets.wheel.force-include]
"sql" = "skypoints/sql"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: runs against a live Snowflake account (needs SNOWFLAKE_* env vars)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Feed fixture lines are kept whole so they read like the files they represent.
"tests/integration/conftest.py" = ["E501"]
